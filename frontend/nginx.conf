server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (React Router): any path that isn't a real file
    # falls back to index.html so deep links like /patients/abc123 work on
    # a hard refresh instead of 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reasonable caching for hashed build assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
